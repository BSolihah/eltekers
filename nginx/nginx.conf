upstream eisbogor_web {
    server web:8000;
}

server {
    listen 80;
    server_name eltekers-bogor.com www.eltekers-bogor.com localhost _;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name eltekers-bogor.com www.eltekers-bogor.com;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/eltekers-bogor.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eltekers-bogor.com/privkey.pem;

    location / {
        proxy_pass http://eisbogor_web;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    location /static/ {
        alias /app/static/;
    }

    location /media/ {
        alias /app/media/;
    }
}
