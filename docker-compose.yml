version: '3.8'

services:
  db:
    image: postgres:14-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=eisbogor
      - POSTGRES_USER=eisuser
      - POSTGRES_PASSWORD=eispassword
    restart: always

  redis:
    image: redis:7-alpine
    restart: always

  web:
    build: .
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             python manage.py migrate &&
             gunicorn --bind 0.0.0.0:8000 --workers 3 eltekers.wsgi:application"
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgres://eisuser:eispassword@db:5432/eisbogor
      - REDIS_URL=redis://redis:6379/1
    depends_on:
      - db
      - redis
    restart: always

  nginx:
    image: nginx:1.25-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/static
      - media_volume:/app/media
    ports:
      - "80:80"
    depends_on:
      - web
    restart: always

volumes:
  postgres_data:
  static_volume:
  media_volume:
